<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日程調整｜林 洸太</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="林 洸太との打ち合わせ日程のご予約ページです。ご希望のWeb会議ツールをお選びください。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ffffff; --tint:#f7f8fa; --ink:#0b1526; --text:#364152; --sub:#6b7689;
  --line:#e5e8ee; --accent:#0d8b7d;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
main{max-width:520px;margin:0 auto;padding:56px 16px 48px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{margin:0 0 6px;font-size:26px;color:var(--ink);font-weight:700;letter-spacing:.02em}
.name{margin:0 0 28px;color:var(--sub);font-size:14px}
.lead{margin:0 0 28px}
.choices{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.choice{display:flex;align-items:center;gap:14px;padding:18px 18px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s,transform .15s}
.choice:hover,.choice:focus-visible{border-color:var(--accent);background:var(--tint);outline:none}
.choice:active{transform:scale(.99)}
.mark{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;font-family:"Inter",sans-serif}
.meet .mark{background:#1e8e3e}
.zoom .mark{background:#2d8cff}
.teams .mark{background:#5b5fc7}
.label{flex:1;min-width:0}
.label strong{display:block;font-size:16px;font-weight:600}
.label span{display:block;font-size:12.5px;color:var(--sub);line-height:1.5}
.arrow{flex:none;color:var(--sub);font-size:18px}
.note{margin:28px 0 0;padding:16px;background:var(--tint);border-radius:10px;font-size:13px;color:var(--sub);line-height:1.7}
.note p{margin:0}
.note p+p{margin-top:6px}
footer{margin-top:40px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<main>
  <p class="eyebrow">SCHEDULE</p>
  <h1>日程調整</h1>
  <p class="name">林 洸太</p>

  <p class="lead">お打ち合わせのお時間をいただきありがとうございます。<br>ご希望のWeb会議ツールを選び、ご都合のよい日時をお選びください。</p>

  <ul class="choices">
    <li>
      <a class="choice meet" href="https://timerex.net/s/pilooooooooo222_b0f3/19fbe4c8">
        <span class="mark" aria-hidden="true">M</span>
        <span class="label"><strong>Google Meet</strong><span>ブラウザからそのまま参加できます</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </li>
    <li>
      <a class="choice zoom" href="https://timerex.net/s/pilooooooooo222_b0f3/2ae7c830">
        <span class="mark" aria-hidden="true">Z</span>
        <span class="label"><strong>Zoom</strong><span>Zoomアプリ・ブラウザで参加できます</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </li>
    <li>
      <a class="choice teams" href="https://timerex.net/s/pilooooooooo222_b0f3/5be23ead">
        <span class="mark" aria-hidden="true">T</span>
        <span class="label"><strong>Microsoft Teams</strong><span>Teamsアプリ・ブラウザで参加できます</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </li>
  </ul>

  <div class="note">
    <p>ご予約が確定すると、会議URLを記載した確認メールが届きます。</p>
    <p>ご都合のよい日時が見つからない場合は、お手数ですが直接ご連絡ください。</p>
  </div>

  <footer>林 洸太</footer>
</main>
</body>
</html>
